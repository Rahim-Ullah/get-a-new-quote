<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Inspiring Quotes</title>
    <script src="App.js" defer></script>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .quote-fade {
        animation: fadeIn 0.4s ease-out;
      }
      .gradient-text {
        background: linear-gradient(45deg, #ff0000, #ff6b6b);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div class="min-h-screen w-full py-12 px-4 bg-gradient-to-br from-red-50 to-gray-50">
      <div class="max-w-4xl mx-auto flex flex-col items-center gap-8">
        <h1 class="text-5xl font-bold gradient-text text-center mb-4">
          Inspiring Quotes
        </h1>
        <div class="w-full transform hover:scale-105 transition-transform duration-300">
          <div class="bg-white rounded-lg shadow-2xl p-8 border-l-4 border-red-500">
            <div class="quote-fade">
              <p id="quoteText" class="text-2xl font-serif leading-relaxed text-gray-800 mb-6"></p>
              <div class="flex justify-between items-end">
                <p id="quoteAuthor" class="text-xl italic text-red-600 font-semibold"></p>
                <p id="quoteId" class="text-sm text-gray-400"></p>
              </div>
            </div>
          </div>
        </div>
        <div class="flex gap-4 mt-6">
          <button class="px-8 py-3 bg-red-600 text-white rounded-full hover:bg-red-700 transform hover:scale-105 transition-all duration-300 shadow-lg" id="prevBtn">
            Previous
          </button>
          <button class="px-8 py-3 bg-red-600 text-white rounded-full hover:bg-red-700 transform hover:scale-105 transition-all duration-300 shadow-lg" id="nextBtn">
            Next
          </button>
          <button class="px-8 py-3 bg-red-600 text-white rounded-full hover:bg-red-700 transform hover:scale-105 transition-all duration-300 shadow-lg" id="randomBtn">
            Random
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
