<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inspiring Quotes</title>

    <meta
      name="description"
      content="Read and navigate inspiring quotes with a clean and modern interface."
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="App.js" defer></script>

    <style>
      :root {
        --brand-red: #dc2626;
        --brand-red-dark: #b91c1c;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .quote-fade {
        animation: fadeInUp 0.45s ease-out;
      }

      .gradient-text {
        background: linear-gradient(135deg, #dc2626, #f87171);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .btn {
        @apply px-6 py-3 md:px-8 md:py-3 rounded-full text-white font-semibold shadow-lg transition-all duration-300;
        background: linear-gradient(135deg, var(--brand-red), #ef4444);
      }

      .btn:hover {
        transform: translateY(-1px) scale(1.03);
        background: linear-gradient(135deg, var(--brand-red-dark), #dc2626);
      }

      .btn:active {
        transform: translateY(0) scale(0.98);
      }

      .btn:focus-visible {
        outline: 3px solid #fecaca;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-rose-50 via-red-50 to-slate-100 text-gray-800 antialiased"
  >
    <main class="w-full px-4 py-10 md:py-14">
      <section
        class="mx-auto flex w-full max-w-4xl flex-col items-center gap-8"
        aria-labelledby="page-title"
      >
        <header class="text-center">
          <h1 id="page-title" class="text-4xl md:text-5xl font-extrabold gradient-text">
            Inspiring Quotes
          </h1>
          <p class="mt-3 text-sm md:text-base text-gray-600">
            Discover motivation, one quote at a time.
          </p>
        </header>

        <article
          class="w-full rounded-2xl border border-white/60 bg-white/80 backdrop-blur shadow-2xl p-6 md:p-10 transition-transform duration-300 hover:scale-[1.01]"
          aria-live="polite"
          aria-atomic="true"
        >
          <div class="quote-fade">
            <p
              id="quoteText"
              class="text-xl md:text-3xl font-serif leading-relaxed text-gray-900 mb-6"
            ></p>

            <div class="flex items-end justify-between gap-4">
              <p
                id="quoteAuthor"
                class="text-lg md:text-xl italic text-red-700 font-semibold"
              ></p>
              <p id="quoteId" class="text-xs md:text-sm text-gray-400 font-mono"></p>
            </div>
          </div>
        </article>

        <nav
          class="mt-2 flex flex-wrap items-center justify-center gap-3 md:gap-4"
          aria-label="Quote navigation"
        >
          <button id="prevBtn" class="btn" aria-label="Show previous quote">
            Previous
          </button>
          <button id="nextBtn" class="btn" aria-label="Show next quote">
            Next
          </button>
          <button id="randomBtn" class="btn" aria-label="Show random quote">
            Random
          </button>
        </nav>

        <footer class="pt-2 text-xs text-gray-500 text-center">
          Keep going — your next favorite quote is one click away.
        </footer>
      </section>
    </main>
  </body>
</html>
